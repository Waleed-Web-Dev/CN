name: CN

services:
   api:
      build:
          context: ./backend
          target: production
      restart: unless-stopped
      env_file: ./backend/.env
      networks:
        - CN

   frontend:
     build:
       context: ./frontend
       target: production
     restart: unless-stopped
     networks:
       - CN
     command: npm run dev -- --host 0.0.0.0
     depends_on:
       - api

   caddy:
     image: caddy:2-alpine
     ports:
       - "80:80"
       - "443:443"
     volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
     networks:
       - CN
     depends_on:
       - frontend
       - api


volumes:
   caddy_data:
   caddy_config:

networks:
  CN:
    driver: bridge